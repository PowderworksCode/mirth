[package]
name = "mirth-lab"
description = "Checks (oracles) over rustc: differentials, metamorphic rewrites, invariants, sweeps over its test suites"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mirth-lab"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
rayon = "1.12"
rand = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
wait-timeout = "0.2"
libc = "0.2"
mirth-rewrite = { path = "../mirth-rewrite" }
