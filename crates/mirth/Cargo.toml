[package]
name = "mirth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Change a Rust program's MIR from a rustc driver that Cargo accepts."

[dependencies]
twox-hash = { version = "2.1.3", default-features = false, features = ["xxhash3_64"] }

# Lets rust-analyzer find the compiler crates; see HACKING.md.
[package.metadata.rust-analyzer]
rustc_private = true
